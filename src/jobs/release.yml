parameters:
  command:
    type: string
    default: yarn semantic-release

executor: default

steps:
  - attach_workspace:
      at: .
  - run:
      command: |
        NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
        echo "export NPM_ID_TOKEN=$NPM_ID_TOKEN" >> "$BASH_ENV"
  - run:
      command: <<parameters.command>>
