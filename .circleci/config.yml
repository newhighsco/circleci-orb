version: 2.1

orbs:
  cli: circleci/circleci-cli@0.1.11
  newhighsco: {}
  node: circleci/node@7.2.1
  orb-tools: circleci/orb-tools@12.5.0

jobs:
  release:
    executor: node/default
    steps:
      - attach_workspace:
          at: .
      - cli/install
      - run:
          command: yarn build
      - run:
          command: |
            git config --global http.https://github.com/.extraheader "Authorization: Basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
            yarn semantic-release --debug

workflows:
  version: 2
  test_and_release:
    jobs:
      - newhighsco/setup:
          name: setup
      - orb-tools/lint:
          name: test
          requires:
            - setup
      - orb-tools/pack:
          name: build
          requires:
            - test
      - orb-tools/publish:
          context:
            - release
          name: prerelease
          orb_name: newhighsco/orb
          circleci_token: CIRCLECI_API_TOKEN
          pub_type: dev
          vcs_type: <<pipeline.project.type>>
          requires:
            - build
          filters:
            branches:
              ignore:
                - main
      - release:
          context:
            - release
          requires:
            - build
          filters:
            branches:
              only:
                - main
